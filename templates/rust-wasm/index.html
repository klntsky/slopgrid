<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: black; }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #error { position: absolute; inset: 1rem; color: white; white-space: pre-wrap; font: 14px monospace; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Game canvas"></canvas>
    <pre id="error" role="alert" hidden></pre>
    <script type="module">
      import { start } from "./runtime.js";

      const onError = (error) => {
        const message = document.getElementById("error");
        message.textContent = String(error);
        message.hidden = false;
        console.error(error);
      };
      try {
        const runtime = await start(document.getElementById("game"), { onError });
        window.addEventListener("pagehide", () => runtime.stop(), { once: true });
      } catch (error) {
        onError(error);
      }
    </script>
  </body>
</html>
